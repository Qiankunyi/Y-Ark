[project]
name = "y-ark"
version = "0.2.1"
description = "Y-Ark: a local YouTube saving tool for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["yt-dlp[default]", "PySide6-Essentials>=6.7", "mutagen>=1.47"]

[project.gui-scripts]
y-ark = "creatorsave.app:main"

[project.urls]
Homepage = "https://github.com/Qiankunyi/Y-Ark"
Issues = "https://github.com/Qiankunyi/Y-Ark/issues"

[tool.setuptools.packages.find]
include = ["creatorsave*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
